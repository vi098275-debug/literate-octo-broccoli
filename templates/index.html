<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Анализ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary-blue: #00a2ff; /* Основной синий */
            --soft-blue: #70c5ff;    /* Мягкий синий для текста */
            --bg-dark: #0b0c10; 
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: #fff; overflow-x: hidden; }
        
        .blob {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 162, 255, 0.08) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; z-index: -1; animation: move 20s infinite alternate;
        }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(20%, 20%); } }

        .hero { padding: 90px 0 50px; text-align: center; }
        h1 { 
            font-size: 3.2rem; font-weight: 700; 
            color: #fff;
            letter-spacing: -1px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(0, 162, 255, 0.2);
            border-radius: 16px; padding: 35px; text-decoration: none; display: block; 
            transition: all 0.3s ease-in-out; opacity: 0; animation: fadeInUp 0.6s forwards;
        }
        
        /* СИНЕНЬКИЙ ТЕКСТ ТУТ */
        .stat-card h3 { 
            color: var(--primary-blue); 
            font-weight: 700; 
            font-size: 1.4rem; 
            margin-bottom: 8px; 
        }
        .stat-card p { 
            color: var(--soft-blue); 
            font-weight: 400; 
            font-size: 1rem; 
            margin: 0; 
        }
        
        .stat-card:hover {
            background: rgba(0, 162, 255, 0.05); 
            border-color: var(--primary-blue);
            transform: translateY(-5px); 
            box-shadow: 0 12px 25px rgba(0, 162, 255, 0.15);
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="blob"></div>
    <div class="blob" style="right: 0; top: 20%; background: radial-gradient(circle, rgba(0, 162, 255, 0.05) 0%, rgba(0,0,0,0) 70%);"></div>

    <div class="hero container">
        <h1>Ecommerce Анализ</h1>
        <p style="color: #6a6a6a;">Сравнение ведущих платформ и стратегий их создателей</p>
    </div>

    <div class="container pb-5">
        <div class="row g-4">
            <div class="col-md-6"><a href="/alibaba" class="stat-card delay-1"><h3>ALIBABA</h3><p>Анализ глобальной B2B сети</p></a></div>
            <div class="col-md-6"><a href="/amazon" class="stat-card delay-2"><h3>AMAZON</h3><p>Доминирование в B2C сегменте</p></a></div>
            <div class="col-md-6"><a href="/jack-ma" class="stat-card delay-3"><h3>ДЖЕК МА</h3><p>История создания Alibaba Group</p></a></div>
            <div class="col-md-6"><a href="/jeff-bezos" class="stat-card delay-4"><h3>ДЖЕФФ БЕЗОС</h3><p>Становление империи Amazon</p></a></div>
        </div>
    </div>
</body>
</html>
