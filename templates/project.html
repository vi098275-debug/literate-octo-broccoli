<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #0b0c10; color: #ffffff !important; 
            font-family: 'Inter', sans-serif; padding-top: 50px; 
        }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .content-box { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px);
            border-radius: 24px; padding: 50px; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-weight: 800; color: #ffffff !important; font-size: 2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
        .text-body { 
            font-size: 1.3rem; line-height: 1.8; color: #ffffff !important; 
            white-space: pre-line; margin: 35px 0; text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
        }
        .btn-done { 
            background: #007bff; color: white !important; border: none; padding: 20px; 
            border-radius: 15px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s;
        }
        .btn-done:hover { background: #00a2ff; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-box">
            <h1>{{ title }}</h1>
            <div class="text-body">{{ story }}</div>
            <button class="btn-done" onclick="finish()">МАТЕРИАЛ ИЗУЧЕН — ВЕРНУТЬСЯ</button>
        </div>
    </div>
    <script>
        function finish() {
            const t = "{{ title }}".toLowerCase();
            if(t.includes("alibaba")) localStorage.setItem('ali_done', 'true');
            if(t.includes("amazon")) localStorage.setItem('amz_done', 'true');
            window.location.href = "/";
        }
    </script>
</body>
</html>
