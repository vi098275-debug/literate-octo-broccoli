<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff; padding-top: 50px; }
        .main-content { max-width: 800px; margin: auto; padding: 20px; }
        .header-box { border-bottom: 2px solid #0d6efd; padding-bottom: 20px; margin-bottom: 30px; }
        .back-link { color: #0d6efd; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { font-weight: 700; }
        .content-text { line-height: 1.8; font-size: 1.1rem; text-align: justify; color: #444; }
    </style>
</head>
<body>
    <div class="container main-content">
        <a href="/" class="back-link">← Вернуться к списку</a>
        <div class="header-box mt-3">
            <h1>{{ title }}</h1>
            <span class="badge bg-primary">{{ mode }}</span>
        </div>
        <div class="content-text">
            <p>{{ story }}</p>
        </div>
    </div>
</body>
</html>
