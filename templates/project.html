<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       <style>
    :root { --accent: #007bff; }
    body { 
        background: #0f111a; 
        color: #ffffff; 
        font-family: 'Inter', sans-serif; 
        padding: 60px 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }

    /* ПЛАШКИ: Поправил отступы и переполнение */
    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px; 
        padding: 40px; /* Увеличил отступы внутри */
        margin-bottom: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        position: relative;
        overflow: hidden; /* Чтобы ничего не вылетало */
        text-align: left;
    }

    /* ЗАГОЛОВКИ И ТЕКСТ: Теперь точно БЕЛЫЙ */
    h1, h2 { 
        font-weight: 800; 
        color: #ffffff !important; 
        margin-bottom: 10px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    
    p { 
        color: #ffffff !important; 
        opacity: 0.9; /* Чуть мягче, но всё равно белый */
        font-size: 1.1rem;
        margin-bottom: 25px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    /* КНОПКА: Теперь она сидит внутри и не вылетает */
    .btn-link { 
        display: inline-block; /* Сделал блочно-строчной, чтоб не перла на всю ширину */
        background: var(--accent); 
        color: #ffffff !important; 
        text-decoration: none; 
        padding: 14px 40px; 
        border-radius: 14px; 
        font-weight: 700; 
        transition: all 0.3s ease;
        border: none;
        box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
    }

    .btn-link:hover { 
        background: #00a2ff; 
        transform: translateY(-2px); 
        box-shadow: 0 8px 25px rgba(0, 123, 255, 0.5);
    }

    /* Для центровки кнопок, если хочешь их по центру плашки */
    .btn-wrapper {
        width: 100%;
        display: block;
    }

    .hidden { display: none !important; }
</style>
</head>
<body>
   <div id="plates-container">
    <div id="plate-alibaba" class="glass-card">
        <h2>Alibaba Group</h2>
        <p>История Джека Ма и экосистема Востока.</p>
        <a href="/alibaba" class="btn-link">Изучить материал</a>
    </div>
    <div id="plate-amazon" class="glass-card">
        <h2>Amazon Inc.</h2>
        <p>Империя Безоса и облачные технологии AWS.</p>
        <a href="/amazon" class="btn-link">Изучить материал</a>
    </div>
</div>

    </div>

    <script>
        function finish() {
            const title = "{{ title }}".toLowerCase();
            if(title.includes("alibaba")) localStorage.setItem('ali_done', 'true');
            if(title.includes("amazon")) localStorage.setItem('amz_done', 'true');
            window.location.href = "/";
        }
    </script>
</body>
</html>
