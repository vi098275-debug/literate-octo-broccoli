<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0c10; color: white; padding-top: 50px; font-family: 'Inter', sans-serif; }
        .content-box { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 40px; border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.8s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .text-body { font-size: 1.2rem; line-height: 1.8; white-space: pre-line; margin: 30px 0; }
        .btn-done { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-box">
            <h1>{{ title }}</h1>
            <div class="badge bg-primary mb-3">{{ mode }}</div>
            <div class="text-body">{{ story }}</div>
            <button class="btn-done" onclick="finish()">МАТЕРИАЛ ИЗУЧЕН — ВЕРНУТЬСЯ</button>
        </div>
    </div>

    <script>
        function finish() {
            const title = "{{ title }}".toLowerCase();
            if(title.includes("alibaba")) localStorage.setItem('ali_done', 'true');
            if(title.includes("amazon")) localStorage.setItem('amz_done', 'true');
            window.location.href = "/";
        }
    </script>
</body>
</html>
