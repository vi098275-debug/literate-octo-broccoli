<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top, #1c1e26 0%, #0b0c10 100%); 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            padding-top: 50px; 
            min-height: 100vh;
        }

        .content-box { 
            /* Стекло теперь чуть плотнее, чтобы текст не тонул */
            background: rgba(20, 22, 28, 0.85); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 24px; 
            padding: 50px; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            
            /* Плавное появление снизу */
            opacity: 0;
            transform: translateY(30px);
            animation: glassEmerge 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes glassEmerge {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { 
            font-weight: 800; 
            color: #ffffff !important; 
            font-size: 2.8rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8); 
            margin-bottom: 20px;
        }

        .badge-custom { 
            display: inline-block;
            font-size: 0.9rem; 
            background: #007bff !important; 
            color: white !important;
            padding: 8px 20px; 
            margin-bottom: 30px; 
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        
        .text-body { 
            font-size: 1.3rem; 
            line-height: 1.8; 
            /* КИПЕННО БЕЛЫЙ ЦВЕТ */
            color: #ffffff !important; 
            white-space: pre-line; 
            text-align: left;
            /* ДВОЙНАЯ ТЕНЬ ДЛЯ МОЩНОЙ ЧИТАЕМОСТИ */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1), 0 0 10px rgba(0,0,0,0.5);
            font-weight: 400;
        }

        .btn-done { 
            background: linear-gradient(90deg, #007bff, #00a2ff);
            color: white !important;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3);
        }

        .btn-done:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 123, 255, 0.5);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="container mb-5">
        <div class="content-box">
            <div class="badge-custom">{{ mode }}</div>
            <h1>{{ title }}</h1>
            
            <div class="text-body">
                {{ story }}
            </div>

            <button class="btn-done" onclick="markAsFinished()">МАТЕРИАЛ ИЗУЧЕН — ВЕРНУТЬСЯ</button>
        </div>
    </div>

    <script>
        function markAsFinished() {
            const currentTitle = "{{ title }}".toLowerCase();
            if (currentTitle.includes("alibaba")) {
                localStorage.setItem('ali_done', 'true');
            } else if (currentTitle.includes("amazon")) {localStorage.setItem('amz_done', 'true');
            }
            // Уходим на главную
            window.location.href = "/";
        }
    </script>
</body>
</html>
