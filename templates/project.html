<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Либа для конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            background: radial-gradient(circle at top, #1c1e26 0%, #0b0c10 100%); 
            color: #ffffff; font-family: 'Inter', sans-serif; padding-top: 50px; min-height: 100vh; overflow-x: hidden;
        }

        /* КОНТЕЙНЕР-ПЛАШКА */
        .content-box { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 24px; padding: 50px; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
            opacity: 0; transform: translateY(30px);
            animation: emerge 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative; z-index: 2;
        }

        @keyframes emerge { to { opacity: 1; transform: translateY(0); } }

        .text-body { font-size: 1.25rem; line-height: 1.8; color: #ffffff !important; white-space: pre-line; margin-bottom: 30px; }
        .badge { background: #007bff !important; padding: 10px 20px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; display: inline-block; }

        /* КНОПКИ */
        .btn-custom {
            background: #007bff; color: white; border: none; padding: 15px 30px;
            border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-custom:hover { background: #00a2ff; transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 162, 255, 0.4); }

        /* ТЕСТ */
        #test-section { display: none; }
        .question { margin-bottom: 25px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; }
        .option { display: block; padding: 10px; cursor: pointer; transition: 0.2s; }
        .option:hover { background: rgba(255,255,255,0.1); border-radius: 8px; }

        /* ЛИВЕНЬ */
        #rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; display: none; }
        .drop { position: absolute; width: 1px; height: 25px; background: white; opacity: 0.3; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="rain-container"></div>

    <div class="container mb-5">
        <!-- СЕКЦИЯ С ТЕКСТОМ -->
        <div id="article-section" class="content-box">
            <a href="/" style="color: #00a2ff; text-decoration: none;">← НА ГЛАВНУЮ</a>
            <h1 class="mt-3">{{ title }}</h1>
            <div class="badge">{{ mode }}</div>
            <div class="text-body">{{ story }}</div>
            <button class="btn-custom" onclick="startTestMode()">МАТЕРИАЛ ИЗУЧЕН — ПЕРЕЙТИ К ТЕСТУ</button>
        </div>

        <!-- СЕКЦИЯ С ТЕСТОМ -->
        <div id="test-section" class="content-box">
            <h1>Тестирование знаний</h1>
            <div id="quiz-content"></div>
            <button class="btn-custom mt-4" onclick="checkAnswers()">ОТПРАВИТЬ ОТВЕТЫ</button>
        </div>

        <!-- СЕКЦИЯ РЕЗУЛЬТАТА -->
        <div id="result-section" class="content-box hidden text-center">
            <h1 id="res-title"></h1>
            <div id="res-score" style="font-size: 4rem; font-weight: 800;"></div>
            <p id="res-text" class="text-body"></p>
            <button class="btn-custom" onclick="location.reload()">ПОВТОРИТЬ МАТЕРИАЛ</button>
            <button class="btn-custom" style="background:#444" onclick="location.href='/'">ВЕРНУТЬСЯ НА ГЛАВНУЮ</button>
        </div>
    </div>

    <script>
       const questions = [
    { q: "В каком году Джек Ма основал Alibaba?", a: ["1999", "2003", "1994"], correct: 0 },
    { q: "Какая система Amazon питает половину интернета?", a: ["Prime", "AWS", "Cainiao"], correct: 1 },
    { q: "Что такое Alipay?", a: ["Доставка на дронах", "Облачный сервис", "Платежная система"], correct: 2 },
    { q: "Какая площадка Alibaba гарантирует подлинность брендов (Apple, Nike)?", a: ["Taobao", "AliExpress", "Tmall"], correct: 2 },
    { q: "Какую стратегию выбрал Джефф Безос в начале пути?", a: ["Get Big Fast", "Slow and Steady", "Customer First"], correct: 0 },
    { q: "Сколько заказов в СЕКУНДУ обрабатывает Alibaba в День Холостяка?", a: ["100 000", "583 000", "1 000 000"], correct: 1 },
    { q: "Как называется система Amazon, отправляющая товар до его покупки?", a: ["Fast Delivery", "Future Shipping", "Anticipatory Shipping"], correct: 2 },
    { q: "Какое подразделение Alibaba отвечает за логистику?", a: ["Ant Group", "Cainiao", "Hema"], correct: 1 },
    { q: "Сколько друзей собрал Джек Ма в своей квартире в 1999 году?", a: ["10 друзей", "17 друзей", "25 друзей"], correct: 1 },
    { q: "Почему Безос начал именно с книг?", a: ["Он обожал читать", "Их было легко каталогизировать и доставлять", "Был низкий налог на печать"], correct: 1 }
        ];

        function startTestMode() {
            document.getElementById('article-section').classList.add('hidden');
            const testSec = document.getElementById('test-section');
            testSec.style.display = 'block';
            
            let html = '';
            questions.forEach((q, i) => {
                html += `<div class="question"><p><b>${i+1}. ${q.q}</b></p>`;
                q.a.forEach((opt, oi) => {
                    html += `<label class="option"><input type="radio" name="q${i}" value="${oi}"> ${opt}</label>`;
                });
                html += `</div>`;
            });
            document.getElementById('quiz-content').innerHTML = html;
        }

        function checkAnswers() {
            let score = 0;
            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && parseInt(selected.value) === q.c) score++;
            });

            const percent = Math.round((score / questions.length) * 100);
            showResult(percent);
        }

        function showResult(p) {
            document.getElementById('test-section').classList.add('hidden');
            const resBox = document.getElementById('result-section');
            resBox.classList.remove('hidden');
            
            document.getElementById('res-score').innerText = p + '%';

            if (p >= 70) {
                document.getElementById('res-title').innerText = "УСВОЕНО!";
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else {
                document.getElementById('res-title').innerText = "НЕ УСВОЕНО...";
                startRain();
            }
        }

        function startRain() {
            const container = document.getElementById('rain-container');
            container.style.display = 'block';
            for (let i = 0; i < 100; i++) {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(drop);
            }
        }
    </script>
</body>
</html>
