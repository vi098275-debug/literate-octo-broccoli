<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            background: #0f172a; /* Темный фон, чтоб стекло заиграло */
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Контейнер для плашки */
        .glass-container {
            width: 90%;
            max-width: 800px;
            
            /* ЭФФЕКТ ЖИДКОГО СТЕКЛА */
            background: rgba(255, 255, 255, 0.05); /* Еле заметный белый */
            backdrop-filter: blur(15px); /* Размытие фона */
            -webkit-backdrop-filter: blur(15px);
            
            border: 1px solid rgba(255, 255, 255, 0.1); /* Тонкая грань */
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            
            /* ПЛАВНОЕ ПОЯВЛЕНИЕ */
            opacity: 0;
            transform: translateY(40px) scale(0.98); /* Немного ниже и чуть меньше */
            animation: emerge 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes emerge {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mode-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 100px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        .story-text {
            line-height: 1.8;
            color: #cbd5e1;
            white-space: pre-line; /* Чтобы переносы из Python работали */
        }

        /* Доп эффект: легкое свечение сверху */
        .glass-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 40%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="mode-badge">{{ mode }}</div>
        <h1>{{ title }}</h1>
        <div class="story-text">
            {{ story }}
        </div>
    </div>

</body>
</html>
