<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Lora:ital@1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; min-height: 100%; background: #000; color: #aaa; font-family: 'Lora', serif; }
        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('https://i.ibb.co/vz6m0Z0/books.jpg');
            background-size: cover; background-position: center; z-index: 1; filter: grayscale(90%);
        }
        .main-container { 
            position: relative; z-index: 200; background: rgba(10,10,10,0.95); 
            border-left: 3px solid #8b0000; padding: 50px; margin-top: 50px; margin-bottom: 50px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        h1 { font-family: 'Cinzel', serif; color: #fff; letter-spacing: 2px; }
        .back-link { color: #8b0000; text-decoration: none; font-weight: bold; letter-spacing: 2px; transition: 0.3s; }
        .back-link:hover { color: #fff; text-shadow: 0 0 10px #8b0000; }
        hr { border-color: #333; opacity: 1; }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="container pb-5">
        <div class="main-container">
            <a href="/" class="back-link">&larr; ВЕРНУТЬСЯ В АРХИВ</a>
            <h1 class="mt-4">{{ title }}</h1>
            <p class="text-danger fw-bold">CLASSIFICATION: {{ mode }}</p>
            <hr>
            <div class="mt-4">
                <p style="text-align: justify; line-height: 1.8; font-size: 1.1rem;">{{ story }}</p>
            </div>
        </div>
    </div>
</body>
</html>
